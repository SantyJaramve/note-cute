<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note-Cute - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <div class="login-bg"></div>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <span class="logo-icon">📝</span>
          <h1>Note-Cute</h1>
        </div>
        <p class="tagline">Tus notas, tu estilo</p>
      </div>
      
      <form id="authForm" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="loginBtn">Iniciar Sesión</button>
          <button type="button" class="btn btn-secondary" id="registerBtn">Registrarse</button>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
      </form>
    </div>
    
    <div class="login-features">
      <div class="feature">
        <span class="feature-icon">🎨</span>
        <span>100% Personalizable</span>
      </div>
      <div class="feature">
        <span class="feature-icon">📊</span>
        <span>Tablas Excel</span>
      </div>
      <div class="feature">
        <span class="feature-icon">🖼️</span>
        <span>Imágenes Flotantes</span>
      </div>
      <div class="feature">
        <span class="feature-icon">✏️</span>
        <span>Dibujar en Imágenes</span>
      </div>
    </div>
  </div>
  
  <script src="js/auth.js"></script>
</body>
</html>
