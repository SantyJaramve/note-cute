<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note-Cute - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Comfortaa:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/plugins.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/iconfont.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/css/luckysheet.css" rel="stylesheet">
</head>
<body class="dashboard-page">
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="ph-fill ph-note logo-icon"></i>
          <span class="logo-text">Note-Cute</span>
        </div>
        <button class="btn-new-note" id="newNoteBtn">
          <i class="ph-bold ph-plus"></i> Nueva Nota
        </button>
      </div>
      
      <div class="notes-list" id="notesList">
      </div>
       
      <div class="sidebar-footer">
        <button class="btn-logout" id="logoutBtn">
          <i class="ph ph-sign-out"></i> Cerrar Sesión
        </button>
      </div>
    </aside>
    
    <main class="main-content">
      <div class="note-workspace" id="noteWorkspace">
        <div class="empty-state" id="emptyState">
          <i class="ph-duotone ph-files empty-icon"></i>
          <h2>Selecciona una nota o crea una nueva</h2>
          <p>Tus notas están esperando por ti</p>
        </div>
        
        <div class="note-editor" id="noteEditor" style="display: none;">
          <div class="note-toolbar" id="noteToolbar">
            <!-- Texto -->
            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="bold" title="Negrita"><b>B</b></button>
              <button class="toolbar-btn" data-command="italic" title="Cursiva"><i>I</i></button>
              <button class="toolbar-btn" data-command="underline" title="Subrayado"><u>S</u></button>
            </div>
            
            <!-- Párrafos -->
            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="formatBlock" data-value="h1" title="Título">H1</button>
              <button class="toolbar-btn" data-command="formatBlock" data-value="h2" title="Subtítulo">H2</button>
              <button class="toolbar-btn" data-command="formatBlock" data-value="p" title="Párrafo">P</button>
            </div>
            
            <!-- Listas -->
            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="insertUnorderedList" title="Viñetas"><i class="ph ph-list-dashes"></i></button>
              <button class="toolbar-btn" data-command="insertOrderedList" title="Numeración"><i class="ph ph-number-square-one"></i></button>
            </div>
            
            <!-- Color de texto -->
            <div class="toolbar-group">
              <input type="color" id="textColorPicker" value="#000000" title="Color texto" class="color-picker">
            </div>
            
            <!-- Color de nota -->
            <div class="toolbar-group">
              <input type="color" id="noteColorPicker" value="#ffffff" title="Color nota" class="color-picker">
              <button class="toolbar-btn" id="noteColorBtn" title="Aplicar"><i class="ph ph-paint-bucket"></i></button>
            </div>
            
            <!-- Resaltador -->
            <div class="toolbar-group">
              <input type="color" id="highlightColorPicker" value="#ffeaa7" title="Color resaltador" class="color-picker">
              <button class="toolbar-btn" id="highlightBtn" title="Resaltar"><i class="ph ph-highlighter"></i></button>
            </div>
            
            <!-- Insertar -->
            <div class="toolbar-group">
              <button class="toolbar-btn" id="insertTableBtn" title="Tabla"><i class="ph ph-table"></i></button>
              <button class="toolbar-btn" id="insertImageBtn" title="Imagen"><i class="ph ph-image"></i></button>
              <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
              <button class="toolbar-btn" id="drawModeBtn" title="Dibujar"><i class="ph ph-pencil-simple"></i></button>
              <button class="toolbar-btn" id="insertStickerBtn" title="Stickers">✨</button>
            </div>
            
            <!-- Guardar/Eliminar -->
            <div class="toolbar-group toolbar-right">
              <button class="toolbar-btn btn-save-note" id="saveNoteBtn" title="Guardar"><i class="ph-bold ph-floppy-disk"></i></button>
              <button class="toolbar-btn btn-delete-note" id="deleteNoteBtn" title="Eliminar"><i class="ph ph-trash"></i></button>
            </div>
          </div>
          
          <input type="text" class="note-title" id="noteTitle" placeholder="Título de la nota" value="">
          
          <div class="note-content" id="noteContent" contenteditable="true" placeholder="Escribe aquí tu nota..."></div>
        </div>
      </div>
    </main>
    
    <div class="drawing-tools" id="drawingTools" style="display: none;">
      <div class="drawing-toolbar">
        <span class="drawing-title"><i class="ph ph-pencil-simple"></i> Modo Dibujo</span>
        <input type="color" id="drawColor" value="#000000" title="Color de línea">
        <input type="range" id="drawSize" min="1" max="20" value="3" title="Grosor">
        <button class="toolbar-btn" id="clearDraw" title="Limpiar"><i class="ph ph-eraser"></i></button>
        <button class="toolbar-btn" id="exitDrawMode" title="Salir"><i class="ph ph-x"></i></button>
      </div>
    </div>

    <div class="sticker-panel" id="stickerPanel" style="display: none;">
      <div class="sticker-header">
        <span><i class="ph ph-sticker"></i> Stickers</span>
        <button class="toolbar-btn" id="closeStickerPanel"><i class="ph ph-x"></i></button>
      </div>
      <div class="sticker-grid" id="stickerGrid"></div>
    </div>
  </div>
  
  <script src="js/auth.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/editor.js" defer></script>
  <script src="js/spreadsheet.js" defer></script>
  <script src="js/drawing.js" defer></script>
  <script src="js/stickers.js"></script>
  <script>
    // Sticker functionality
    document.addEventListener('DOMContentLoaded', function() {
      const stickerBtn = document.getElementById('insertStickerBtn');
      const stickerPanel = document.getElementById('stickerPanel');
      const closeStickerBtn = document.getElementById('closeStickerPanel');
      const stickerGrid = document.getElementById('stickerGrid');
      
      if (stickerBtn && stickerPanel) {
        stickerBtn.addEventListener('click', function() {
          if (stickerPanel.style.display === 'none') {
            stickerPanel.style.display = 'block';
            loadStickers();
          } else {
            stickerPanel.style.display = 'none';
          }
        });
      }
      
      if (closeStickerBtn) {
        closeStickerBtn.addEventListener('click', function() {
          stickerPanel.style.display = 'none';
        });
      }
      
      function loadStickers() {
        if (stickerGrid && stickerData && stickerData.stickers) {
          stickerGrid.innerHTML = '';
          stickerData.stickers.forEach(function(sticker) {
            const div = document.createElement('div');
            div.className = 'sticker-item';
            div.title = sticker.name;
            div.innerHTML = '<img src="' + sticker.url + '" alt="' + sticker.name + '">';
            div.addEventListener('click', function() {
              insertSticker(sticker.url);
              stickerPanel.style.display = 'none';
            });
            stickerGrid.appendChild(div);
          });
        }
      }
      
      function insertSticker(url) {
        const noteContent = document.getElementById('noteContent');
        if (!noteContent) return;
        
        const wrapper = document.createElement('div');
        wrapper.className = 'floating-image';
        wrapper.style.position = 'absolute';
        wrapper.style.zIndex = '50';
        wrapper.style.left = '50px';
        wrapper.style.top = '50px';
        
        const img = document.createElement('img');
        img.src = url;
        img.style.maxWidth = '150px';
        img.style.display = 'block';
        
        const canvas = document.createElement('canvas');
        canvas.className = 'drawing-canvas';
        canvas.style.position = 'absolute';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.pointerEvents = 'none';
        
        wrapper.appendChild(img);
        wrapper.appendChild(canvas);
        
        noteContent.appendChild(wrapper);
        
        img.onload = function() {
          canvas.width = img.offsetWidth;
          canvas.height = img.offsetHeight;
          canvas.style.width = img.offsetWidth + 'px';
          canvas.style.height = img.offsetHeight + 'px';
        };
        
        if (typeof Editor !== 'undefined' && Editor.setupFloatingImage) {
          Editor.setupFloatingImage(wrapper);
        }
        
        if (typeof Drawing !== 'undefined' && Drawing.initCanvas) {
          Drawing.initCanvas(wrapper);
        }
      }
    });
  </script>
</body>
</html>
