<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note-Cute - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Comfortaa:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/plugins.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/iconfont.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/css/luckysheet.css" rel="stylesheet">
</head>
<body class="dashboard-page">
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="ph-fill ph-note logo-icon"></i>
          <span class="logo-text">Note-Cute</span>
        </div>
        <button class="btn-new-note" id="newNoteBtn">
          <i class="ph-bold ph-plus"></i> Nueva Nota
        </button>
      </div>
      
      <div class="notes-list" id="notesList">
      </div>
       
      <div class="sidebar-footer">
        <button class="btn-logout" id="logoutBtn">
          <i class="ph ph-sign-out"></i> Cerrar Sesión
        </button>
      </div>
    </aside>
    
    <main class="main-content">
      <div class="note-workspace" id="noteWorkspace">
        <div class="empty-state" id="emptyState">
          <i class="ph-duotone ph-files empty-icon"></i>
          <h2>Selecciona una nota o crea una nueva</h2>
          <p>Tus notas están esperando por ti</p>
        </div>
        
        <div class="note-editor" id="noteEditor" style="display: none;">
          <div class="note-toolbar" id="noteToolbar">
            <!-- Texto -->
            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="bold" title="Negrita"><b>B</b></button>
              <button class="toolbar-btn" data-command="italic" title="Cursiva"><i>I</i></button>
              <button class="toolbar-btn" data-command="underline" title="Subrayado"><u>S</u></button>
            </div>
            
            <!-- Párrafos -->
            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="formatBlock" data-value="h1" title="Título">H1</button>
              <button class="toolbar-btn" data-command="formatBlock" data-value="h2" title="Subtítulo">H2</button>
              <button class="toolbar-btn" data-command="formatBlock" data-value="p" title="Párrafo">P</button>
            </div>
            
            <!-- Listas -->
            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="insertUnorderedList" title="Viñetas"><i class="ph ph-list-ul"></i></button>
              <button class="toolbar-btn" data-command="insertOrderedList" title="Numeración"><i class="ph ph-list-ol"></i></button>
            </div>
            
            <!-- Color de texto -->
            <div class="toolbar-group">
              <input type="color" id="textColorPicker" value="#5d5d5d" title="Color texto" class="color-picker">
            </div>
            
            <!-- Color de nota -->
            <div class="toolbar-group">
              <input type="color" id="noteColorPicker" value="#ffffff" title="Color nota" class="color-picker">
              <button class="toolbar-btn" id="noteColorBtn" title="Aplicar"><i class="ph ph-paint-bucket"></i></button>
            </div>
            
            <!-- Resaltador -->
            <div class="toolbar-group">
              <input type="color" id="highlightColorPicker" value="#ffeaa7" title="Color resaltador" class="color-picker">
              <button class="toolbar-btn" id="highlightBtn" title="Resaltar"><i class="ph ph-highlighter"></i></button>
            </div>
            
            <!-- Insertar -->
            <div class="toolbar-group">
              <button class="toolbar-btn" id="insertTableBtn" title="Tabla"><i class="ph ph-table"></i></button>
              <button class="toolbar-btn" id="insertImageBtn" title="Imagen"><i class="ph ph-image"></i></button>
              <button class="toolbar-btn" id="drawModeBtn" title="Dibujar"><i class="ph ph-pencil-simple"></i></button>
            </div>
            
            <!-- Fondo página -->
            <div class="toolbar-group">
              <input type="color" id="bgColorPicker" value="#fdf6f0" title="Color fondo" class="color-picker">
              <button class="toolbar-btn" id="bgColorBtn" title="Aplicar"><i class="ph ph-paint-roller"></i></button>
              <input type="text" id="bgImageUrl" placeholder="URL" title="Imagen fondo" style="width:50px;padding:2px 4px;border:1px solid #ddd;border-radius:4px;font-size:10px;">
            </div>
            
            <!-- Guardar/Eliminar -->
            <div class="toolbar-group toolbar-right">
              <button class="toolbar-btn btn-save-note" id="saveNoteBtn" title="Guardar"><i class="ph-bold ph-floppy-disk"></i></button>
              <button class="toolbar-btn btn-delete-note" id="deleteNoteBtn" title="Eliminar"><i class="ph ph-trash"></i></button>
            </div>
          </div>
          
          <input type="text" class="note-title" id="noteTitle" placeholder="Título de la nota" value="">
          
          <div class="note-content" id="noteContent" contenteditable="true" placeholder="Escribe aquí tu nota..."></div>
        </div>
      </div>
    </main>
    
    <div class="modal" id="imageModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Insertar Imagen</h3>
          <button class="btn-close-modal" id="closeImageModal">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Desde URL</label>
            <input type="text" id="imageUrl" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>Desde archivo</label>
            <input type="file" id="imageFile" accept="image/*">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancelImageBtn">Cancelar</button>
          <button class="btn btn-primary" id="insertImageBtn2">Insertar</button>
        </div>
      </div>
    </div>
    
    <div class="drawing-tools" id="drawingTools" style="display: none;">
      <div class="drawing-toolbar">
        <span class="drawing-title"><i class="ph ph-pencil-simple"></i> Modo Dibujo</span>
        <input type="color" id="drawColor" value="#000000" title="Color de línea">
        <input type="range" id="drawSize" min="1" max="20" value="3" title="Grosor">
        <button class="toolbar-btn" id="clearDraw" title="Limpiar"><i class="ph ph-eraser"></i></button>
        <button class="toolbar-btn" id="exitDrawMode" title="Salir"><i class="ph ph-x"></i></button>
      </div>
    </div>
  </div>
  
  <script src="js/auth.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/editor.js" defer></script>
  <script src="js/spreadsheet.js" defer></script>
  <script src="js/drawing.js" defer></script>
</body>
</html>
