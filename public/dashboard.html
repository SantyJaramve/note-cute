<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note-Cute - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Comfortaa:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/plugins.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/iconfont.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/css/luckysheet.css" rel="stylesheet">
</head>
<body class="dashboard-page">
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="ph-fill ph-note logo-icon"></i>
          <span class="logo-text">Note-Cute</span>
        </div>
        <button class="btn-new-note" id="newNoteBtn">
          <i class="ph-bold ph-plus"></i> Nueva Nota
        </button>
      </div>
      
      <div class="notes-list" id="notesList">
      </div>
       
      <div class="sidebar-footer">
        <button class="btn-logout" id="logoutBtn">
          <i class="ph ph-sign-out"></i> Cerrar Sesión
        </button>
      </div>
    </aside>
    
    <main class="main-content">
      <div class="note-workspace" id="noteWorkspace">
        <div class="empty-state" id="emptyState">
          <i class="ph-duotone ph-files empty-icon"></i>
          <h2>Selecciona una nota o crea una nueva</h2>
          <p>Tus notas están esperando por ti</p>
        </div>
        
        <div class="note-editor" id="noteEditor" style="display: none;">
          <div class="note-toolbar" id="noteToolbar">
            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="bold" title="Negrita (Ctrl+B)">
                <strong>B</strong>
              </button>
              <button class="toolbar-btn" data-command="italic" title="Cursiva (Ctrl+I)">
                <em>I</em>
              </button>
              <button class="toolbar-btn" data-command="underline" title="Subrayado (Ctrl+U)">
                <u>U</u>
              </button>
              <button class="toolbar-btn" data-command="strikeThrough" title="Tachado">
                <s>S</s>
              </button>
            </div>
            
            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="insertUnorderedList" title="Lista sin orden">
                •
              </button>
              <button class="toolbar-btn" data-command="insertOrderedList" title="Lista ordenada">
                1.
              </button>
            </div>
            
            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="formatBlock" data-value="h1" title="Título 1">
                H1
              </button>
              <button class="toolbar-btn" data-command="formatBlock" data-value="h2" title="Título 2">
                H2
              </button>
              <button class="toolbar-btn" data-command="formatBlock" data-value="p" title="Párrafo">
                P
              </button>
            </div>
            
            <div class="toolbar-group">
              <button class="toolbar-btn" id="highlightBtn" title="Resaltador">
                <i class="ph ph-highlighter"></i>
              </button>
              <input type="color" id="highlightColorPicker" value="#ffeaa7" title="Color de resaltador" class="color-picker" style="width:30px;height:30px;">
              <input type="color" id="textColorPicker" title="Color de texto" class="color-picker">
            </div>
            
            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="formatBlock" data-value="p" title="Párrafo">
                P
              </button>
            </div>
            
            <div class="toolbar-group">
              <button class="toolbar-btn" id="noteColorBtn" title="Color de nota">
                <i class="ph ph-paint-bucket"></i>
              </button>
              <input type="color" id="noteColorPicker" value="#ffffff" title="Elegir color de nota" class="color-picker" style="width:30px;height:30px;">
            </div>
            
            <div class="toolbar-group">
              <button class="toolbar-btn" id="highlightBtn" title="Resaltador">
                <i class="ph ph-highlighter"></i>
              </button>
              <input type="color" id="highlightColorPicker" value="#ffeaa7" title="Color de resaltador" class="color-picker" style="width:30px;height:30px;">
              <input type="color" id="textColorPicker" title="Color de texto" class="color-picker">
            </div>
            
            <div class="toolbar-group">
              <button class="toolbar-btn" id="bgColorBtn" title="Color de fondo">
                <i class="ph ph-paint-roller"></i>
              </button>
              <input type="color" id="bgColorPicker" value="#fdf6f0" title="Elegir color de fondo" class="color-picker" style="width:30px;height:30px;">
              <button class="toolbar-btn" id="bgImageBtn" title="Imagen de fondo">
                <i class="ph ph-image"></i>
              </button>
              <input type="text" id="bgImageUrl" placeholder="URL imagen" style="width:100px;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;">
            </div>
            
            <div class="toolbar-group">
              <button class="toolbar-btn" id="insertTableBtn" title="Insertar Tabla">
                <i class="ph ph-table"></i>
              </button>
              <button class="toolbar-btn" id="insertImageBtn" title="Insertar Imagen">
                <i class="ph ph-image"></i>
              </button>
              <button class="toolbar-btn" id="drawModeBtn" title="Modo Dibujo">
                <i class="ph ph-pencil-simple"></i>
              </button>
            </div>
            
            <div class="toolbar-group toolbar-right">
              <span id="autoSaveStatus" style="font-size:11px;color:#00b894;opacity:0;transition:opacity 0.3s;margin-right:10px;"><i class="ph-bold ph-check-circle"></i> Guardado automático</span>
              <button class="toolbar-btn btn-save-note" id="saveNoteBtn" title="Guardar Nota">
                <i class="ph-bold ph-floppy-disk"></i> Guardar
              </button>
              <button class="toolbar-btn btn-delete-note" id="deleteNoteBtn" title="Eliminar Nota">
                <i class="ph ph-trash"></i>
              </button>
            </div>
          </div>
          
          <input type="text" class="note-title" id="noteTitle" placeholder="Título de la nota" value="">
          
          <div class="note-content" id="noteContent" contenteditable="true" placeholder="Escribe aquí tu nota..."></div>
        </div>
      </div>
    </main>
    
    <div class="modal" id="imageModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Insertar Imagen</h3>
          <button class="btn-close-modal" id="closeImageModal">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Desde URL</label>
            <input type="text" id="imageUrl" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>Desde archivo</label>
            <input type="file" id="imageFile" accept="image/*">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancelImageBtn">Cancelar</button>
          <button class="btn btn-primary" id="insertImageBtn2">Insertar</button>
        </div>
      </div>
    </div>
    
    <div class="drawing-tools" id="drawingTools" style="display: none;">
      <div class="drawing-toolbar">
        <span class="drawing-title"><i class="ph ph-pencil-simple"></i> Modo Dibujo</span>
        <input type="color" id="drawColor" value="#000000" title="Color de línea">
        <input type="range" id="drawSize" min="1" max="20" value="3" title="Grosor">
        <button class="toolbar-btn" id="clearDraw" title="Limpiar"><i class="ph ph-eraser"></i></button>
        <button class="toolbar-btn" id="exitDrawMode" title="Salir"><i class="ph ph-x"></i></button>
      </div>
    </div>
  </div>
  
  <script src="js/auth.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/editor.js" defer></script>
  <script src="js/spreadsheet.js" defer></script>
  <script src="js/drawing.js" defer></script>
</body>
</html>
